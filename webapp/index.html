<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HujjatBot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0a0a12;
    --secondary-bg: #14141f;
    --text: #ffffff;
    --hint: #8b8ba3;
    --link: #8b5cf6;
    --button: #7c5cf0;
    --button-text: #ffffff;
    --section-bg: #12121c;
    --border: rgba(255,255,255,0.08);
    --danger: #ef4444;
    --success: #22c55e;
    --purple: #8b5cf6;
    --purple-2: #a855f7;
    --blue: #3b82f6;
    --blue-2: #38bdf8;
    --orange: #f97316;
    --orange-2: #fb923c;
    --green: #22c55e;
    --green-2: #4ade80;
    --rose: #f43f5e;
    --rose-2: #fb7185;
  }
  html[data-theme="light"] {
    --bg: #ffffff;
    --secondary-bg: #f2f3f7;
    --text: #16161f;
    --hint: #6b7280;
    --link: #7c5cf0;
    --button: #7c5cf0;
    --button-text: #ffffff;
    --section-bg: #ffffff;
    --border: rgba(15,15,25,0.10);
  }
  html[data-theme="light"] .menu-card {
    box-shadow: 0 0 0 1px rgba(15,15,25,0.02), 0 10px 20px -14px var(--card-glow, transparent);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 96px;
  }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar button {
    background: none; border: none; color: var(--link);
    font-size: 20px; cursor: pointer; padding: 2px 6px 2px 0;
  }
  .topbar .title { font-weight: 700; font-size: 16px; flex: 1; }
  .progress-track {
    height: 3px; background: var(--border);
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--purple), var(--blue));
    transition: width 0.35s ease;
  }
  .screen { padding: 20px 16px; animation: fadein 0.2s ease; }
  @keyframes fadein { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform: translateY(0);} }

  .hero { text-align: center; margin: 20px 0 32px; }
  .hero-logo { width: 128px; height: 128px; margin: 0 auto 6px; display: block; }
  .hero h1 {
    font-size: 30px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.01em;
  }
  .hero .tagline { font-size: 15px; font-weight: 700; margin: 0; }
  .hero .tagline .t-oson { color: var(--purple-2); }
  .hero .tagline .t-arzon { color: var(--blue); }
  .hero .tagline .t-tez { color: var(--blue-2); }
  .hero .tagline .dot { color: var(--hint); margin: 0 4px; }
  .hero-icon {
    width: 68px; height: 68px; border-radius: 20px; margin: 0 auto 14px;
    background: linear-gradient(135deg, var(--button), #1a8bc4);
    display: flex; align-items: center; justify-content: center; font-size: 30px;
    box-shadow: 0 10px 26px rgba(42,171,238,0.28);
  }

  .menu-card {
    background: var(--section-bg); border-radius: 16px; padding: 16px 16px;
    display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
    cursor: pointer; border: 1px solid var(--card-accent, var(--border));
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 8px 20px -12px var(--card-glow, transparent);
  }
  .menu-card .ic {
    width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 21px;
    box-shadow: 0 6px 16px -4px var(--card-glow, transparent);
  }
  .menu-card .body { flex: 1; }
  .menu-card .body b { display: block; font-size: 15.5px; font-weight: 700; }
  .menu-card .body span { color: var(--hint); font-size: 12.5px; font-weight: 600; }
  .menu-card .body span.soon { color: var(--card-accent-text, var(--hint)); }
  .menu-card .chev { color: var(--card-accent-text, var(--hint)); font-size: 20px; font-weight: 700; }

  .footer-pill {
    margin: 22px auto 4px; display: flex; align-items: center; justify-content: center;
    gap: 4px; padding: 10px 18px; border-radius: 999px; width: fit-content;
    background: var(--section-bg); border: 1px solid var(--border);
    font-size: 12.5px; font-weight: 600; color: var(--hint);
  }
  .footer-pill b.star { color: var(--purple-2); margin-right: 4px; }
  .footer-pill .f-oson { color: var(--purple-2); }
  .footer-pill .f-arzon { color: var(--blue); }
  .footer-pill .f-tez { color: var(--green-2); }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 13px; font-weight: 600; color: var(--hint);
    margin-bottom: 6px;
  }
  .field input, .field textarea {
    width: 100%; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--secondary-bg); color: var(--text);
    padding: 11px 12px; font-size: 15px; font-family: inherit;
    outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--button); }
  .section-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.03em; color: var(--hint); margin: 22px 0 10px;
  }
  .section-title:first-child { margin-top: 0; }

  .type-card {
    background: var(--section-bg); border: 2px solid var(--border); border-radius: 14px;
    padding: 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; cursor: pointer;
  }
  .type-card.selected { border-color: var(--button); background: color-mix(in srgb, var(--button) 8%, var(--section-bg)); }
  .type-card .emoji { font-size: 26px; }
  .type-card b { display: block; font-size: 15px; }
  .type-card span { color: var(--hint); font-size: 12.5px; }

  .list-item {
    background: var(--section-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
  }
  .list-item .info { flex: 1; }
  .list-item .info b { display: block; font-size: 14px; }
  .list-item .info span { color: var(--hint); font-size: 12px; }
  .list-item .actions { display: flex; gap: 6px; }
  .icon-btn {
    background: var(--secondary-bg); border: none; border-radius: 8px;
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px; color: var(--text);
  }
  .icon-btn.danger { color: var(--danger); }

  .add-card {
    background: var(--section-bg); border: 1.5px dashed var(--hint); border-radius: 12px;
    padding: 12px; margin-bottom: 12px;
  }
  .dash-btn {
    width: 100%; background: color-mix(in srgb, var(--button) 10%, var(--bg));
    border: 2px dashed var(--button); color: var(--button);
    border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer;
    margin-bottom: 12px;
  }

  .photo-drop {
    border: 2px dashed var(--button); border-radius: 16px; padding: 32px 20px;
    text-align: center; background: color-mix(in srgb, var(--button) 6%, var(--bg));
    cursor: pointer; margin-bottom: 16px;
  }
  .photo-drop .ic { font-size: 34px; margin-bottom: 8px; }
  .photo-drop b { color: var(--link); display: block; font-size: 15px; margin-bottom: 3px; }
  .photo-drop span { color: var(--hint); font-size: 12px; }
  .photo-preview { text-align: center; margin-bottom: 16px; }
  .photo-preview img {
    width: 108px; height: 144px; object-fit: cover; border-radius: 10px;
    border: 2px solid var(--border);
  }

  .fmt-card {
    background: var(--section-bg); border: 2px solid var(--border); border-radius: 14px;
    padding: 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; cursor: pointer;
  }
  .fmt-card .ic { width: 46px; height: 46px; border-radius: 12px; display:flex; align-items:center; justify-content:center; font-size: 20px; }

  .preview-card {
    margin-top: 24px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
  }
  .preview-head {
    background: var(--secondary-bg); padding: 10px 14px; font-size: 12px; font-weight: 700;
    color: var(--hint); text-transform: uppercase; letter-spacing: 0.03em;
  }
  .preview-body {
    padding: 14px; background: var(--section-bg); font-family: 'Times New Roman', serif;
    font-size: 12.5px; line-height: 1.7;
  }
  .preview-body .doc-title { text-align: center; font-weight: 700; font-size: 14px; }
  .preview-body .doc-name { text-align: center; font-weight: 700; margin-bottom: 8px; }
  .preview-body .row { margin-bottom: 3px; }
  .preview-body .row b { font-weight: 700; }
  .preview-body .muted { color: var(--hint); font-style: italic; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: var(--bg); border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 10px;
  }
  .btn {
    flex: 1; padding: 14px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 700; cursor: pointer; text-align: center;
  }
  .btn-primary {
    background: linear-gradient(90deg, var(--purple), var(--blue)); color: #fff;
    box-shadow: 0 8px 20px -8px rgba(124,92,240,0.55);
  }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: var(--secondary-bg); color: var(--text); flex: 0 0 auto; padding: 14px 18px; }

  .loading-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 20px; text-align: center;
  }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid var(--border); border-top-color: var(--button);
    animation: spin 0.8s linear infinite; margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .success-wrap { text-align: center; padding: 60px 20px; }
  .success-wrap .ic { font-size: 56px; margin-bottom: 14px; }

  .hidden { display: none !important; }
  .warn-box {
    background: #fff8e1; border: 1px solid #ffd54f; border-radius: 12px;
    padding: 12px 14px; font-size: 13px; color: #795548; line-height: 1.5; margin-top: 14px;
  }
</style>
</head>
<body>

<div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div id="app"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
// Telegram'ning tabiiy "orqaga" tugmasi/gesti (Android hardware/swipe back,
// iOS gesture) Mini App ichida "yopish" o'rniga "oldingi ekranga qaytish"
// vazifasini bajarishi uchun - shu funksiyaga ulaymiz (bir marta ro'yxatdan
// o'tkazamiz, har render()da emas)
if (tg?.BackButton) {
  tg.BackButton.onClick(() => goBack());
}

function applyColorScheme() {
  const scheme = tg?.colorScheme === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", scheme);
}
applyColorScheme();
tg?.onEvent?.("themeChanged", applyColorScheme);

const state = {
  screen: "home",
  turi: null,
  answers: {},
  mehnat: [],
  qarindoshlar: [],
  photoBase64: null,
  format: null,
  editingMehnatIdx: null,
  editingQarIdx: null,
  orderId: null,
  orderService: null,
  paymentInfo: null,
  receiptBase64: null,
  pollTimer: null,
  slideTopic: "",
  slideCount: 10,
  slideTemplate: "blue",
  referatTopic: "",
  referatIshTuri: "referat",
  referatPages: 10,
  referatFio: "",
  referatMuassasa: "",
  referatFakultet: "",
  referatGuruh: "",
  testTopic: "",
  testCount: 20,
  testFormat: "word",
  photo3x4Base64: null,
};

const SLIDE_TEMPLATES = [
  { id: "blue", name: "Ko'k klassik", colors: ["#1B4F72", "#ffffff"] },
  { id: "dark", name: "Tungi tex", colors: ["#120E2B", "#8B5CF6"] },
  { id: "warm", name: "Iliq ijodiy", colors: ["#E87A5D", "#3D8B8A"] },
  { id: "yellow", name: "Sariq hisobot", colors: ["#F5B71E", "#1A1A1A"] },
];
const slide_gen_min = 5;
const slide_gen_max = 30;
const SLIDE_PRICE_PER = 900;

const REFERAT_MIN_PAGES = 5;
const REFERAT_MAX_PAGES = 20;
const REFERAT_PRICE_PER_PAGE = 1200;

const TEST_MIN_Q = 10;
const TEST_MAX_Q = 50;
const TEST_PRICE_PER_Q = 400;

const PRICE_3X4 = 5000;

const ISHCHI_FIELDS = [
  { id: "fio", label: "To'liq ismingiz (FIO)", ph: "Namuna: Qodirov Jasur Baxtiyorovich" },
  { id: "tashkilot", label: "Ish joyi (tashkilot va bo'lim)", ph: "Namuna: Toshkent shahar Sog'liqni saqlash boshqarmasi" },
  { id: "tug_yil", label: "Tug'ilgan sanangiz", ph: "Namuna: 12.07.1993" },
  { id: "tug_joy", label: "Tug'ilgan joyingiz", ph: "Namuna: Toshkent shahri, Chilonzor tumani" },
  { id: "millat", label: "Millatingiz", ph: "Namuna: O'zbek" },
  { id: "partiya", label: "Partiyaviyligi", ph: "Namuna: Yo'q" },
  { id: "malumot", label: "Ma'lumot darajasi", ph: "Namuna: Oliy" },
  { id: "tamomlagan", label: "Qaysi o'quv yurtini, qachon tamomlagan", ph: "Namuna: 2016-yil Toshkent Davlat Iqtisodiyot universiteti" },
  { id: "mutaxassislik", label: "Mutaxassisligi", ph: "Namuna: Menejer" },
];

const TALABA_FIELDS = [
  { id: "fio", label: "To'liq ismingiz (FIO)", ph: "Namuna: Yusupova Malika Alisherovna" },
  { id: "tashkilot", label: "O'quv yurti va fakultet", ph: "Namuna: Toshkent Davlat Texnika universiteti, Muhandislik fakulteti" },
  { id: "kurs", label: "Kurs va ta'lim darajasi", ph: "Namuna: 3-kurs, bakalavriat" },
  { id: "tug_yil", label: "Tug'ilgan sanangiz", ph: "Namuna: 08.11.2004" },
  { id: "tug_joy", label: "Tug'ilgan joyingiz", ph: "Namuna: Toshkent shahri, Yunusobod tumani" },
  { id: "millat", label: "Millatingiz", ph: "Namuna: O'zbek" },
  { id: "partiya", label: "Partiyaviyligi", ph: "Namuna: Yo'q" },
  { id: "malumot", label: "Oldingi ta'lim (maktab/kollej)", ph: "Namuna: 2022-yil Toshkent 21-maktab" },
  { id: "mutaxassislik", label: "O'qish yo'nalishi (mutaxassislik)", ph: "Namuna: Kompyuter injiniringi" },
];

const TAIL_FIELDS = [
  { id: "ilmiy_daraja", label: "Ilmiy darajasi", ph: "Namuna: Yo'q" },
  { id: "ilmiy_unvon", label: "Ilmiy unvoni", ph: "Namuna: Yo'q" },
  { id: "chet_til", label: "Chet tillarini bilishi", ph: "Namuna: Ingliz tili, Rus tili" },
  { id: "harbiy", label: "Harbiy (maxsus) unvoni", ph: "Namuna: Yo'q" },
  { id: "mukofot", label: "Davlat mukofoti bilan taqdirlanganmi", ph: "Namuna: Yo'q" },
  { id: "deputat", label: "Xalq deputati yoki saylanadigan organ a'zosimi", ph: "Namuna: Yo'q" },
  { id: "tel", label: "Telefon raqamingiz", ph: "Namuna: 90 123 45 67" },
  { id: "pasport", label: "Pasport seriya va raqami", ph: "Namuna: AA 1234567" },
  { id: "jshshir", label: "JSHSHIR raqami (ixtiyoriy)", ph: "Namuna: 30506950123456" },
];

function fieldsFor(turi) {
  return (turi === "ishchi" ? ISHCHI_FIELDS : TALABA_FIELDS).concat(TAIL_FIELDS);
}

function esc(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = renderScreen();
  bindEvents();
  updateProgress();
  window.scrollTo(0, 0);
  // Ekranda o'zimizning orqaga strelkamiz (backBtn) bo'lsa, Telegram'ning
  // tabiiy orqaga tugmasi/gestini ham shu ekranda faollashtiramiz - shunda
  // Android'da smartfon orqaga gesti ham Mini App'ni yopib qo'ymay, aynan
  // shu goBack() funksiyasini ishga tushiradi.
  if (tg?.BackButton) {
    if (document.getElementById("backBtn")) {
      tg.BackButton.show();
    } else {
      tg.BackButton.hide();
    }
  }
}

function updateProgress() {
  const order = ["home","docType","form","mehnat","qarindoshlar","photo","format","loading","success"];
  const idx = order.indexOf(state.screen);
  const pct = state.screen === "home" ? 0 : Math.round((idx / (order.length - 2)) * 100);
  document.getElementById("progressFill").style.width = Math.min(pct, 100) + "%";
}

function topbar(title, onBack) {
  return `<div class="topbar">
    ${onBack ? `<button id="backBtn">←</button>` : ""}
    <div class="title">${title}</div>
  </div>`;
}

function renderScreen() {
  switch (state.screen) {
    case "home": return screenHome();
    case "docType": return screenDocType();
    case "form": return screenForm();
    case "mehnat": return screenMehnat();
    case "qarindoshlar": return screenQarindoshlar();
    case "photo": return screenPhoto();
    case "format": return screenFormat();
    case "slideTopic": return screenSlideTopic();
    case "slideCount": return screenSlideCount();
    case "slideTemplate": return screenSlideTemplate();
    case "testTopic": return screenTestTopic();
    case "testCount": return screenTestCount();
    case "testFormat": return screenTestFormat();
    case "referatType": return screenReferatType();
    case "referatTopic": return screenReferatTopic();
    case "referatPages": return screenReferatPages();
    case "referatInfo": return screenReferatInfo();
    case "photo3x4Upload": return screenPhoto3x4Upload();
    case "loading": return screenLoading();
    case "payment": return screenPayment();
    case "waiting_review": return screenWaitingReview();
    case "ready": return screenReady();
    case "rejected": return screenRejected();
    case "success": return screenSuccess();
    default: return screenHome();
  }
}

function screenHome() {
  return `

function screenDocType() {
  return `
  ${topbar("Obyektivka turi", true)}
  <div class="screen">
    <p style="color:var(--hint);font-size:14px;margin:0 0 16px;">Qanday obyektivka kerak?</p>
    <div class="type-card ${state.turi==='ishchi'?'selected':''}" data-type="ishchi">
      <span class="emoji">👔</span>
      <div><b>Xodim obyektivkasi</b><span>Ishlovchi shaxslar uchun</span></div>
    </div>
    <div class="type-card ${state.turi==='talaba'?'selected':''}" data-type="talaba">
      <span class="emoji">🎓</span>
      <div><b>Talaba obyektivkasi</b><span>O'quvchi va talabalar uchun</span></div>
    </div>
  </div>`;
}

function screenForm() {
  const fields = fieldsFor(state.turi);
  const mainCount = state.turi === "ishchi" ? ISHCHI_FIELDS.length : TALABA_FIELDS.length;
  let html = topbar("Ma'lumotlar", true) + `<div class="screen">`;
  html += `<div class="section-title">Asosiy ma'lumotlar</div>`;
  fields.forEach((f, i) => {
    if (i === mainCount) html += `<div class="section-title">Qo'shimcha ma'lumotlar</div>`;
    html += `<div class="field"><label>${esc(f.label)}</label>
      <input type="text" data-field="${f.id}" placeholder="${esc(f.ph)}" value="${esc(state.answers[f.id]||'')}">
    </div>`;
  });
  html += renderPreview();
  html += `</div>`;
  html += `<div class="bottom-bar">
    <button class="btn btn-primary" id="continueBtn">Davom etish →</button>
  </div>`;
  return html;
}

function renderPreview() {
  const a = state.answers;
  if (!a.fio) return "";
  return `<div class="preview-card">
    <div class="preview-head">Hujjat ko'rinishi (jonli)</div>
    <div class="preview-body">
      <div class="doc-title">MA'LUMOTNOMA</div>
      <div class="doc-name">${esc(a.fio)}</div>
      <div class="row"><b>Tug'ilgan yili:</b> ${a.tug_yil ? esc(a.tug_yil) : '<span class="muted">to\'ldirilmagan</span>'}</div>
      <div class="row"><b>Tug'ilgan joyi:</b> ${a.tug_joy ? esc(a.tug_joy) : '<span class="muted">to\'ldirilmagan</span>'}</div>
      <div class="row"><b>Millati:</b> ${a.millat ? esc(a.millat) : '<span class="muted">-</span>'}</div>
      <div class="row"><b>Mutaxassisligi:</b> ${a.mutaxassislik ? esc(a.mutaxassislik) : '<span class="muted">-</span>'}</div>
    </div>
  </div>`;
}

function screenMehnat() {
  let html = topbar("Mehnat faoliyati", true) + `<div class="screen">`;
  html += `<p style="color:var(--hint);font-size:13px;margin:0 0 14px;">Qayerda ishlagan yoki ishlaydi</p>`;
  state.mehnat.forEach((m, i) => {
    html += `<div class="list-item">
      <div class="info"><b>${esc(m.yillar)} yy.</b><span>${esc(m.tashkilot)}</span></div>
      <div class="actions">
        <button class="icon-btn" data-edit-mehnat="${i}">✎</button>
        <button class="icon-btn danger" data-del-mehnat="${i}">✕</button>
      </div>
    </div>`;
  });
  const editing = state.editingMehnatIdx;
  const editVal = editing !== null ? state.mehnat[editing] : { yillar: "", tashkilot: "" };
  html += `<div class="add-card">
    <div class="field" style="margin-bottom:8px;"><input type="text" id="mehnatYil" placeholder="Namuna: 2018-2022" value="${esc(editVal.yillar)}"></div>
    <div class="field" style="margin-bottom:8px;"><input type="text" id="mehnatJoy" placeholder="Namuna: Toshkent shahar 4-sonli poliklinika, hamshira" value="${esc(editVal.tashkilot)}"></div>
    <button class="dash-btn" id="mehnatAddBtn" style="margin-bottom:0;">${editing !== null ? '✓ Saqlash' : '+ Qo\'shish'}</button>
  </div>`;

function bindEvents() {
  document.getElementById("backBtn")?.addEventListener("click", goBack);
  document.getElementById("homeBtn")?.addEventListener("click", () => { resetAll(); state.screen = "home"; render(); });

  document.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", () => {
      state.screen = el.dataset.nav;
      render();
    });
  });

  document.querySelectorAll("[data-soon]").forEach(el => {
    el.addEventListener("click", () => {
      tg?.HapticFeedback?.notificationOccurred("warning");
      if (tg?.showAlert) {
        tg.showAlert(`${el.dataset.soon} — tez orada qo'shiladi!`);
      } else {
        alert(`${el.dataset.soon} — tez orada qo'shiladi!`);
      }
    });
  });

  document.querySelectorAll("[data-type]").forEach(el => {
    el.addEventListener("click", () => {
      state.turi = el.dataset.type;
      state.answers = {};
      state.screen = "form";
      render();
    });
  });

  document.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("input", () => {
      state.answers[el.dataset.field] = el.value;
      const preview = document.querySelector(".preview-card");
      if (preview) {
        const wrap = document.createElement("div");
        wrap.innerHTML = renderPreview();
        preview.replaceWith(wrap.firstElementChild || document.createTextNode(""));
      } else if (el.dataset.field === "fio" && el.value) {
        document.querySelector(".screen").insertAdjacentHTML("beforeend", renderPreview());
      }
    });
  });

  document.getElementById("continueBtn")?.addEventListener("click", handleContinue);

  document.getElementById("mehnatAddBtn")?.addEventListener("click", () => {
    const yil = document.getElementById("mehnatYil").value.trim();
    const joy = document.getElementById("mehnatJoy").value.trim();
    if (!yil || !joy) { tg?.HapticFeedback?.notificationOccurred("error"); return; }
    if (state.editingMehnatIdx !== null) {
      state.mehnat[state.editingMehnatIdx] = { yillar: yil, tashkilot: joy };
      state.editingMehnatIdx = null;
    } else {
      state.mehnat.push({ yillar: yil, tashkilot: joy });
    }
    render();
  });
  document.querySelectorAll("[data-del-mehnat]").forEach(el => {
    el.addEventListener("click", () => { state.mehnat.splice(+el.dataset.delMehnat, 1); render(); });
  });
  document.querySelectorAll("[data-edit-mehnat]").forEach(el => {
    el.addEventListener("click", () => { state.editingMehnatIdx = +el.dataset.editMehnat; render(); });
  });

  document.getElementById("qarAddBtn")?.addEventListener("click", () => {
    const munosabat = document.getElementById("qMunosabat").value.trim();
    const fio = document.getElementById("qFio").value.trim();
    const tug = document.getElementById("qTug").value.trim();
    const ish = document.getElementById("qIsh").value.trim();
    const turar = document.getElementById("qTurar").value.trim();
    if (!munosabat || !fio) { tg?.HapticFeedback?.notificationOccurred("error"); return; }
    const entry = { munosabat, fio, tug, ish, turar };
    if (state.editingQarIdx !== null) {
      state.qarindoshlar[state.editingQarIdx] = entry;
      state.editingQarIdx = null;
    } else {
      state.qarindoshlar.push(entry);
    }
    render();
  });
  document.querySelectorAll("[data-del-qar]").forEach(el => {
    el.addEventListener("click", () => { state.qarindoshlar.splice(+el.dataset.delQar, 1); render(); });
  });
  document.querySelectorAll("[data-edit-qar]").forEach(el => {
    el.addEventListener("click", () => { state.editingQarIdx = +el.dataset.editQar; render(); });
  });

  document.getElementById("photoDrop")?.addEventListener("click", () => document.getElementById("photoInput").click());
  document.getElementById("photoChangeBtn")?.addEventListener("click", () => document.getElementById("photoInput").click());
  document.getElementById("photoInput")?.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { state.photoBase64 = reader.result; render(); };
    reader.readAsDataURL(file);
  });

  document.querySelectorAll("[data-fmt]").forEach(el => {
    el.addEventListener("click", () => { state.format = el.dataset.fmt; createOrder(); });
  });

  document.getElementById("copyCardBtn")?.addEventListener("click", () => {
    const num = state.paymentInfo?.card_number || "";
    const plain = num.replace(/\s/g, "");
    const done = () => {
      tg?.HapticFeedback?.notificationOccurred("success");
      tg?.showAlert ? tg.showAlert("Karta raqami nusxalandi") : alert("Karta raqami nusxalandi");
    };
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(plain).then(done).catch(() => {
        tg?.showAlert ? tg.showAlert(plain) : alert(plain);
      });
    } else {
      tg?.showAlert ? tg.showAlert(plain) : alert(plain);
    }
  });

  document.getElementById("receiptDrop")?.addEventListener("click", () => document.getElementById("receiptInput").click());
  document.getElementById("receiptChangeBtn")?.addEventListener("click", () => document.getElementById("receiptInput").click());
  document.getElementById("receiptInput")?.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { state.receiptBase64 = reader.result; render(); };
    reader.readAsDataURL(file);
  });

  document.getElementById("payDoneBtn")?.addEventListener("click", submitReceipt);
  document.getElementById("retryPayBtn")?.addEventListener("click", () => {
    state.receiptBase64 = null;
    state.screen = "payment";
    render();
  });

  document.getElementById("slideTopicInput")?.addEventListener("input", (e) => {
    state.slideTopic = e.target.value;
  });
  document.getElementById("slideTopicNext")?.addEventListener("click", () => {
    if (!state.slideTopic.trim()) {
      tg?.showAlert ? tg.showAlert("Iltimos, mavzuni kiriting") : alert("Iltimos, mavzuni kiriting");
      return;
    }
    state.screen = "slideCount";
    render();
  });

  document.getElementById("slideCountInput")?.addEventListener("input", (e) => {
    let v = parseInt(e.target.value, 10) || slide_gen_min;
    v = Math.max(slide_gen_min, Math.min(slide_gen_max, v));
    state.slideCount = v;
    const priceEl = document.querySelector(".screen p b");
    if (priceEl) priceEl.textContent = `${state.slideCount * SLIDE_PRICE_PER} so'm`;
  });
  document.getElementById("slideCountNext")?.addEventListener("click", () => {
    state.screen = "slideTemplate";
    render();
  });

  document.querySelectorAll("[data-template]").forEach(el => {
    el.addEventListener("click", () => { state.slideTemplate = el.dataset.template; render(); });
  });
  document.getElementById("slideTemplateNext")?.addEventListener("click", createSlideOrder);

  // ── Test tayyorlash ──────────────────────────────────
  document.getElementById("testTopicInput")?.addEventListener("input", (e) => {
    state.testTopic = e.target.value;
  });
  document.getElementById("testTopicNext")?.addEventListener("click", () => {
    if (!state.testTopic.trim()) {
      tg?.showAlert ? tg.showAlert("Iltimos, mavzuni kiriting") : alert("Iltimos, mavzuni kiriting");
      return;
    }
    state.screen = "testCount";
    render();
  });

  document.getElementById("testCountInput")?.addEventListener("input", (e) => {
    let v = parseInt(e.target.value, 10) || TEST_MIN_Q;
    v = Math.max(TEST_MIN_Q, Math.min(TEST_MAX_Q, v));
    state.testCount = v;
    const priceEl = document.querySelector(".screen p b");
    if (priceEl) priceEl.textContent = `${state.testCount * TEST_PRICE_PER_Q} so'm`;
  });
  document.getElementById("testCountNext")?.addEventListener("click", () => {
    state.screen = "testFormat";
    render();
  });

  document.querySelectorAll("[data-testfmt]").forEach(el => {
    el.addEventListener("click", () => { state.testFormat = el.dataset.testfmt; createTestOrder(); });
  });

  // ── Referat / Mustaqil ish ───────────────────────────
  document.querySelectorAll("[data-referattype]").forEach(el => {
    el.addEventListener("click", () => {
      state.referatIshTuri = el.dataset.referattype;
      state.screen = "referatTopic";
      render();
    });
  });

  document.getElementById("referatTopicInput")?.addEventListener("input", (e) => {
    state.referatTopic = e.target.value;
  });
  document.getElementById("referatTopicNext")?.addEventListener("click", () => {
    if (!state.referatTopic.trim()) {
      tg?.showAlert ? tg.showAlert("Iltimos, mavzuni kiriting") : alert("Iltimos, mavzuni kiriting");
      return;
    }
    state.screen = "referatPages";
    render();
  });

  document.getElementById("referatPagesInput")?.addEventListener("input", (e) => {
    let v = parseInt(e.target.value, 10) || REFERAT_MIN_PAGES;
    v = Math.max(REFERAT_MIN_PAGES, Math.min(REFERAT_MAX_PAGES, v));
    state.referatPages = v;
    const priceEl = document.querySelector(".screen p b");
    if (priceEl) priceEl.textContent = `${state.referatPages * REFERAT_PRICE_PER_PAGE} so'm`;
  });
  document.getElementById("referatPagesNext")?.addEventListener("click", () => {
    state.screen = "referatInfo";
    render();
  });

  document.getElementById("referatFioInput")?.addEventListener("input", (e) => { state.referatFio = e.target.value; });
  document.getElementById("referatMuassasaInput")?.addEventListener("input", (e) => { state.referatMuassasa = e.target.value; });
  document.getElementById("referatFakultetInput")?.addEventListener("input", (e) => { state.referatFakultet = e.target.value; });
  document.getElementById("referatGuruhInput")?.addEventListener("input", (e) => { state.referatGuruh = e.target.value; });
  document.getElementById("referatInfoNext")?.addEventListener("click", () => {
    if (!state.referatFio.trim()) {
      tg?.showAlert ? tg.showAlert("Iltimos, F.I.O kiriting") : alert("Iltimos, F.I.O kiriting");
      return;
    }
    createReferatOrder();
  });

  // ── 3×4 rasm ──────────────────────────
  document.getElementById("photo3x4Drop")?.addEventListener("click", () => document.getElementById("photo3x4Input").click());
  document.getElementById("photo3x4ChangeBtn")?.addEventListener("click", () => document.getElementById("photo3x4Input").click());
  document.getElementById("photo3x4Input")?.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { state.photo3x4Base64 = reader.result; render(); };
    reader.readAsDataURL(file);
  });
  document.getElementById("photo3x4Next")?.addEventListener("click", () => {
    if (!state.photo3x4Base64) {
      tg?.showAlert ? tg.showAlert("Iltimos, rasm yuklang") : alert("Iltimos, rasm yuklang");
      return;
    }
    createPhoto3x4Order();
  });
}

function goBack() {
  const paymentBackMap = {
    slayd: "slideTemplate", referat: "referatInfo", test: "testFormat", photo3x4: "photo3x4Upload",
  };
  const map = {
    docType: "home", form: "docType", mehnat: "form",
    qarindoshlar: "mehnat", photo: "qarindoshlar", format: "photo",
    payment: paymentBackMap[state.orderService] || "format",
    slideTopic: "home", slideCount: "slideTopic", slideTemplate: "slideCount",
    testTopic: "home", testCount: "testTopic", testFormat: "testCount",
    referatType: "home", referatTopic: "referatType", referatPages: "referatTopic",
    referatInfo: "referatPages",
    photo3x4Upload: "home",
  };
  state.screen = map[state.screen] || "home";
  state.editingMehnatIdx = null;
  state.editingQarIdx = null;
  render();
}

function handleContinue() {
  if (state.screen === "form") state.screen = "mehnat";
  else if (state.screen === "mehnat") state.screen = "qarindoshlar";
  else if (state.screen === "qarindoshlar") state.screen = "photo";
  else if (state.screen === "photo") {
    state.screen = "format";
  }
  render();
}

function resetAll() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  state.turi = null; state.answers = {}; state.mehnat = []; state.qarindoshlar = [];
  state.photoBase64 = null; state.format = null;
  state.editingMehnatIdx = null; state.editingQarIdx = null;
  state.orderId = null; state.orderService = null; state.paymentInfo = null; state.receiptBase64 = null;
  state.slideTopic = ""; state.slideCount = 10; state.slideTemplate = "blue";
  state.testTopic = ""; state.testCount = 20; state.testFormat = "word";
  state.referatTopic = ""; state.referatIshTuri = "referat"; state.referatPages = 10;
  state.referatFio = ""; state.referatMuassasa = ""; state.referatFakultet = ""; state.referatGuruh = "";
  state.photo3x4Base64 = null;
}

async function createOrder() {
  state.screen = "loading";
  render();

  const payload = {
    initData: tg?.initData || "",
    turi: state.turi,
    answers: state.answers,
    mehnat: state.mehnat,
    qarindoshlar: state.qarindoshlar,
    photo_base64: state.photoBase64,
    format: state.format,
  };

  try {
    const res = await fetch("/api/create_order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.ok) {
      state.orderId = data.order_id;
      state.orderService = "obyektivka";
      state.paymentInfo = { amount: data.amount, card_number: data.card_number, card_holder: data.card_holder };
      state.screen = "payment";
    } else {
      const msg = "Xatolik: " + (data.error || "noma'lum xato");
      tg?.showAlert ? tg.showAlert(msg) : alert(msg);
      state.screen = "format";
    }
  } catch (e) {
    const msg = "Tarmoq xatosi: " + e.message;
    tg?.showAlert ? tg.showAlert(msg) : alert(msg);
    state.screen = "format";
  }
  render();
}

async function submitReceipt() {
  if (!state.receiptBase64) {
    tg?.showAlert ? tg.showAlert("Avval chek rasmini yuklang") : alert("Avval chek rasmini yuklang");
    return;
  }
  state.screen = "waiting_review";
  render();

  try {
    const res = await fetch("/api/submit_receipt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg?.initData || "", order_id: state.orderId, receipt_base64: state.receiptBase64 }),
    });
    const data = await res.json();
    if (data.ok) {
      startPolling();
    } else {
      const msg = "Xatolik: " + (data.error || "noma'lum xato");
      tg?.showAlert ? tg.showAlert(msg) : alert(msg);
      state.screen = "payment";
      render();
    }
  } catch (e) {
    const msg = "Tarmoq xatosi: " + e.message;
    tg?.showAlert ? tg.showAlert(msg) : alert(msg);
    state.screen = "payment";
    render();
  }
}

function startPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`/api/order_status?order_id=${state.orderId}`);
      const data = await res.json();
      if (!data.ok) return;
      if (data.status === "tayyor") {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
        state.screen = "ready";
        tg?.HapticFeedback?.notificationOccurred("success");
        render();
      } else if (data.status === "rad_etildi") {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
        state.screen = "rejected";
        tg?.HapticFeedback?.notificationOccurred("error");
        render();
      }
    } catch (e) {
      // keyingi urinishda qayta tekshiradi
    }
  }, 4000);
}
